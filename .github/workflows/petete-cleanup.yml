name: Remove cancelled Petete project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/petete-cleanup.yml']
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const projectHeads=new Set(["19f42f8998f9024e91893275750def931eb74547","d616e0f4c6a2c1a520cd94ae3d90480878f80502","7788ebaf7426eaea8b7001a5c7e2e107a39067a2","dc4d95d2e659b1d5f51d1283fd9f94cc152955c9"]);
            const workflows=await github.paginate(github.rest.actions.listRepoWorkflows,{owner,repo,per_page:100});
            for(const w of workflows){
              if((/petete/i.test(w.name)||/petete-/i.test(w.path))&&!/cleanup/.test(w.path)){
                try{await github.rest.actions.disableWorkflow({owner,repo,workflow_id:w.id});}
                catch(error){if(error.status!==404)throw error;}
              }
            }
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,per_page:100});
            for(const run of runs){
              if(run.id===context.runId||!projectHeads.has(run.head_sha))continue;
              if(!['completed'].includes(run.status)){
                try{await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});}
                catch(error){if(![409,422].includes(error.status))throw error;}
                for(let attempt=0;attempt<15;attempt++){
                  const current=await github.rest.actions.getWorkflowRun({owner,repo,run_id:run.id});
                  if(current.data.status==='completed')break;
                  await new Promise(resolve=>setTimeout(resolve,2000));
                }
              }
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              for(const artifact of artifacts){
                try{await github.rest.actions.deleteArtifact({owner,repo,artifact_id:artifact.id});}
                catch(error){if(error.status!==404)throw error;}
              }
              try{await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:run.id});}
              catch(error){if(error.status!==404)throw error;}
            }
            try{await github.rest.git.deleteRef({owner,repo,ref:'heads/petete-data'});core.info('Deleted Petete data branch.');}
            catch(error){if(error.status!==404)throw error;core.info('Petete data branch already absent.');}
            core.info('Petete scheduled workflows, source archive and previous workflow runs removed.');
            try{await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:context.runId});}
            catch(error){core.info('Cleanup audit run retained by GitHub (HTTP '+error.status+').');}
