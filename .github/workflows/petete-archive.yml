name: Petete DGT source archive
on:
  push:
    branches: [main]
    paths:
      - "projects/petete/**"
      - ".github/workflows/*archive*.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: petete-dgt-source-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/petete
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/petete/package-lock.json
      - run: npm ci
      - name: Verify checkpoint and collector behavior
        run: node --test scripts/archive-store.test.mjs scripts/archive-runner.test.mjs
      - name: Set archive paths on the runner
        shell: bash
        run: |
          echo "ARCHIVE_WORKTREE=$RUNNER_TEMP/petete-data" >> "$GITHUB_ENV"
          echo "ARCHIVE_DIRECTORY=$RUNNER_TEMP/petete-data/archive" >> "$GITHUB_ENV"
      - name: Restore durable data branch
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/petete-data > "$RUNNER_TEMP/petete-data-ref"; then
            git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin refs/heads/petete-data
            git -C "$GITHUB_WORKSPACE" worktree add --detach "$ARCHIVE_WORKTREE" FETCH_HEAD
          else
            code=$?
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            git -C "$GITHUB_WORKSPACE" worktree add --detach "$ARCHIVE_WORKTREE" HEAD
          fi
      - name: Collect official DGT records and preserve checkpoints
        id: collect
        continue-on-error: true
        run: >-
          node --experimental-transform-types scripts/archive-collect.mjs
          --dir "$ARCHIVE_DIRECTORY"
          --bootstrap-seconds 180
          --bootstrap-documents 60
          --max-seconds 1800
          --max-documents 2000
          --interval-ms 1200
      - name: Verify and atomically publish source data
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ARCHIVE_DIRECTORY/manifest.json" ]; then
            echo 'No valid checkpoint was created. Nothing will be published.'
            exit 1
          fi
          node scripts/archive-verify.mjs --dir "$ARCHIVE_DIRECTORY" --prune
          git -C "$ARCHIVE_WORKTREE" config user.name 'github-actions[bot]'
          git -C "$ARCHIVE_WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ARCHIVE_WORKTREE" add --all -- archive
          if git -C "$ARCHIVE_WORKTREE" diff --cached --quiet; then
            echo 'No source archive changes to publish.'
          else
            git -C "$ARCHIVE_WORKTREE" commit -m 'Update Petete DGT source archive and verified cursor'
            git -C "$ARCHIVE_WORKTREE" push origin HEAD:refs/heads/petete-data
          fi
      - name: Surface a preserved source failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo '::error::DGT collection stopped. The last valid cursor and source error were preserved in petete-data/archive/manifest.json.'
          exit 1
