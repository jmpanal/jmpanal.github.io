name: Deploy Petete to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petete-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: petete-production
    defaults:
      run:
        working-directory: projects/petete
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PETETE_ADMIN_EMAIL: ${{ secrets.PETETE_ADMIN_EMAIL }}
      PETETE_ADMIN_PASSWORD: ${{ secrets.PETETE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/petete/package-lock.json
      - name: Validate deployment secret configuration
        run: |
          node --input-type=module <<'JS'
          import {adminCiConfiguration} from './scripts/create-admin-ci.mjs';
          const required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','PETETE_ADMIN_EMAIL','PETETE_ADMIN_PASSWORD'];
          const missing=required.filter(name=>!process.env[name]);
          if(missing.length)throw new Error('Add these GitHub repository secrets, then rerun: '+missing.join(', '));
          if(!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID))throw new Error('CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID copied from Cloudflare.');
          adminCiConfiguration();
          console.log('Required deployment settings are present.');
          JS
      - run: npm ci
      - name: Provision Cloudflare and deploy Petete
        run: npm run setup:cloudflare
      - name: Initialize admin and start DGT import
        run: node scripts/create-admin-ci.mjs
      - name: Deployment result
        run: |
          node --input-type=module <<'JS'
          import {appendFile} from 'node:fs/promises';
          await appendFile(process.env.GITHUB_STEP_SUMMARY,'## Petete deployed\n\nOpen https://www.jmpanal.com/petete/ and sign in with the administrator email and password you saved as GitHub secrets.\n\nThe DGT import queue is initialized. Historical collection and AI indexing continue in the background; deployment success does not mean the full archive is already indexed.\n');
          JS
