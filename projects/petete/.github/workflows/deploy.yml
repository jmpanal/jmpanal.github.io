name: Deploy Petete to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petete-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: petete-production
    defaults:
      run:
        working-directory: projects/petete
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/petete/package-lock.json
      - run: npm ci
      - run: npm run deploy
